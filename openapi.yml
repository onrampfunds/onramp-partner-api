                  example: "P987654321"
                controller_2_passport_country:
                  type: string
                  description: The second controller's Passport Country, if they do not have a SSN.
                  enum: ["US"]
                  example: "US"
                controller_2_street_address:
                  type: string
                  description: The street address where the second controller resides.
                  example: "789 Oak St"
                controller_2_city:
                  type: string
                  description: The city where the second controller resides.
                  example: "San Francisco"
                controller_2_state:
                  type: string
                  description: The state where the second controller resides. Must be a two character US state code.
                  enum: ["AK", "AL", "AR", "AS", "AZ", "CA", "CO", "CT", "DC", "DE", "FL", "GA", "GU", "HI", "IA", "ID", "IL", "IN", "KS", "KY", "LA", "MA", "MD", "ME", "MI", "MN", "MO", "MS", "MT", "NC", "ND", "NE", "NH", "NJ", "NM", "NV", "NY", "OH", "OK", "OR", "PA", "PR", "RI", "SC", "SD", "TN", "TX", "UT", "VA", "VI", "VT", "WA", "WI", "WV", "WY"]
                  example: "CA"
                controller_2_zip:
                  type: string
                  description: The zip where the second controller resides.
                  example: "94105"
              required:
