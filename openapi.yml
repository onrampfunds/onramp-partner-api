  /partners/api/embed/prequalifications:
    get:
      summary: Prequalify a merchant for the embedded card
      description: |
        Returns the configuration consumed by the `@onrampfunds/embed`
        package's `mount()`. Forward the response body through unmodified:
        it is shaped for the card, and is not a general prequalification
        resource.

        Three required parameters, plus an optional `business_name`. None
        of the sensitive applicant data the referral path collects appears
        here: that endpoint accepts EIN, SSNs and addresses, and this one
        neither asks for them nor returns them.

        `seller_email` is personal data and should be handled as such, but
        it is the only such field, and no response echoes it back — even
        when the record found already holds a full referral payload.

        ## Find-or-create, keyed on the seller's email

        Requests are keyed on `(your partner account, seller_email)`. The
        first call for a merchant creates the record; every later call
        returns that same record and the same `correlationId`. Repeat
        calls are the expected pattern rather than an error — the card
        renders on every page load, and each render is counted.

        ## Responses are camelCase

        Unlike `POST /partners/api/referrals`, which responds in
        `snake_case`, this endpoint responds in `camelCase` so the body
        forwards into `mount()` without a key-mapping layer. Requests
        still accept either case. See **Request and Response Casing**
        above for why the two differ.

        ## A 200 does not guarantee an amount

        When `amount` is `null` the merchant cannot be served. This is a
        **success, not an error**: `mount()` returns `null`, renders
        nothing, and yields the slot back to your page, so you can lay out
        around its absence.

        The no-amount response carries only `correlationId`, `amount`,
        `currency`, and `lexicon`. There is no `applyUrl`, `copy`, or
        `theme`, because nothing is rendered and so no regulated wording
        is owed.

        Two situations produce it:

        - The merchant's `operating_state` is one Onramp does not operate
          in. `lexicon` is `null` in this case.
        - The merchant's 90-day sales fall below the qualifying threshold.
          `lexicon` is populated.

        **Missing or zero sales are a `422`, not a null amount.** The
        distinction is the point: answering `null` to a request that
        reported no sales would let a broken integration look
        indistinguishable from a merchant who genuinely does not qualify,
        and you would have no signal that anything was wrong.

        ## How the amount is calculated

        50% of the 90-day sales total, rounded **up** to the nearest
        $1,000, capped at $500,000. Merchants below $22,500 in 90-day
        sales receive the no-amount response rather than a floored figure.

        See **How Sales Are Aggregated** above for how the 90-day total is
        derived when you send `180_days` or monthly figures instead.

        ## Caching

        Every response carries `Cache-Control: no-store`, including
        rejected ones. The body holds a merchant-specific amount and
        regulated copy with no expiry field to bound its staleness, and
        each call is also recorded as an impression. A cached response
        therefore both shows a stale figure and silently drops renders
        from reporting. Do not cache it, and do not place it behind a
        proxy that ignores the header.
      security:
        - bearerAuth: []
      parameters:
        - name: seller_email
          in: query
          required: true
          description: |
            The merchant's email address. This is the find-or-create key,
            scoped to your partner account. Also accepted as `sellerEmail`.
          schema:
            type: string
            format: email
          example: "merchant@example.com"
        - name: operating_state
          in: query
          required: true
          description: |
            The state the business operates in, as a two character US state
            code. The accepted set also covers DC and the US territories,
            though the API's own validation message calls them all state
            codes.

            This resolves both the `lexicon` and whether Onramp can serve
            the merchant at all — a code Onramp does not operate in returns
            the no-amount response, which is distinct from a code that is
            not in the list below at all and is rejected with a `422`. Also
            accepted as `operatingState`.
          schema:
            type: string
            enum: ["AK", "AL", "AR", "AS", "AZ", "CA", "CO", "CT", "DC", "DE", "FL", "GA", "GU", "HI", "IA", "ID", "IL", "IN", "KS", "KY", "LA", "MA", "MD", "ME", "MI", "MN", "MO", "MS", "MT", "NC", "ND", "NE", "NH", "NJ", "NM", "NV", "NY", "OH", "OK", "OR", "PA", "PR", "RI", "SC", "SD", "TN", "TX", "UT", "VA", "VI", "VT", "WA", "WI", "WV", "WY"]
          example: "TX"
        - name: platforms
          in: query
          required: true
          description: |
            The merchant's sales channels and their reported sales. At
            least one platform with a recognised `type` is required, and
            the reported sales must total more than zero.

            Nested parameters use Rails bracket notation in the query
            string. A single-platform request looks like:

            ```
            GET /partners/api/embed/prequalifications
              ?seller_email=merchant%40example.com
              &operating_state=TX
              &platforms[][type]=shopify
              &platforms[][seller_id]=seller-1
              &platforms[][sales][90_days]=45000.0
            ```

            `seller_id` is also accepted as `sellerId`.

            **The schema below is the parsed shape, not the wire format.**
            Standard OpenAPI array serialization does not produce the form
            above, so a generated client will build the wrong URL unless
            you override it — emit the bracketed keys literally, repeating
            `platforms[]` once per platform.

            Indexed keys are **not** an equivalent spelling.
            `platforms[0][type]=shopify` parses into an object keyed `"0"`
            rather than an array, and the request is rejected with a `422`
            reading `platforms: must be an array of platform objects`.
          schema:
            type: array
            minItems: 1
            items:
              type: object
              required:
                - type
                - seller_id
              properties:
                type:
                  type: string
                  description: |
                    The sales channel (e.g., Shopify, Amazon). A channel
                    Onramp does not recognise contributes zero sales and
                    is not reported back, so a typo here surfaces as a
                    smaller amount than expected — or, if it was the only
                    channel carrying sales, as a `422`.
                  example: "shopify"
                seller_id:
                  type: string
                  description: The merchant's identifier on that channel.
                  example: "seller-1"
                sales:
                  type: object
                  description: |
                    Sales for the channel, in **one** of three
                    representations: `90_days`, `180_days`, or a series of
                    `YYYYMM` months. The first present wins and the rest
                    are never read — `180_days` is halved, and a month
                    series contributes its three most recent months
                    excluding the current one. See *How Sales Are
                    Aggregated* in the overview.

                    Optional on any individual platform, because the
                    requirement is on the total: the figures summed across
                    every platform must come to more than zero. A request
                    in which nothing reports sales is rejected with a
                    `422`. Send it for each platform that has sales.
                  additionalProperties:
                    type: number
                  example:
                    90_days: 45000.0
        - name: business_name
          in: query
          required: false
          description: |
            The merchant's business name, recorded against the lead. It
            does not affect the amount and is not returned in the response.
            Omitting it on a repeat call leaves any previously stored value
            in place. Also accepted as `businessName`.
          schema:
            type: string
          example: "Example Business Inc"
      responses:
        "200":
          description: |
            The card's mount configuration. Note that a `200` carrying
            `amount: null` is a successful response meaning the merchant
            cannot be served — see the endpoint description above.
          headers:
            Cache-Control:
              description: Always `no-store`. This response must not be cached.
              schema:
                type: string
                example: "no-store"
          content:
            application/json:
              schema:
                oneOf:
                  - title: Prequalified
                    type: object
                    description: |
                      The merchant qualifies. All seven keys are present.
                      This is the object to forward into `mount()`.
                    required:
                      - correlationId
                      - amount
                      - currency
                      - applyUrl
                      - lexicon
                      - copy
                      - theme
                    properties:
                      correlationId:
                        type: string
                        format: uuid
                        description: |
                          Stable identifier for this merchant's record. The
                          same value is returned by every subsequent call
                          for the same `seller_email`. Quote it when
                          contacting support.
                        example: "065a417b-ce17-4c64-b8dd-e35a3128a021"
                      amount:
                        type: number
                        description: |
                          The prequalified amount, in whole currency units.
                          Never zero in this variant: an amount of zero is
                          the absence of an offer rather than a small one,
                          and is returned as the no-amount shape.
                        example: 23000.0
                      currency:
                        type: string
                        description: ISO 4217 currency code for `amount`.
                        example: "USD"
                      applyUrl:
                        type: string
                        format: url
                        description: |
                          Where the card's call to action sends the merchant
                          to begin an application. Its path segment is an
                          opaque token, not the `correlationId` — pass the
                          URL through whole rather than deriving it.
                        example: "https://app.onrampfunds.com/partners/prequalifications/3f2vKq8mDhRt6XyZbNwPcE4u"
                      lexicon:
                        type: string
                        enum: ["loan", "mca"]
                        description: |
                          Which product vocabulary applies in the merchant's
                          state, and therefore which wording the card
                          renders. Always populated here, because an amount
                          is only offered in a state Onramp operates in.
                        example: "loan"
                      copy:
                        type: object
                        description: |
                          The regulated strings the card must display. All
                          three are always present in this variant — the
                          embed package refuses a response missing any of
                          them and renders nothing.

                          Render these verbatim. They are served rather than
                          compiled into the package precisely so that a
                          wording correction reaches every partner without a
                          release or any action on your part; substituting
                          your own text defeats that.
                        required:
                          - qualifier
                          - mechanism
                          - disclosure
                        properties:
                          qualifier:
                            type: string
                            description: States that the figure is not an approval.
                            example: "Pre-qualified, not approved."
                          mechanism:
                            type: string
                            description: How repayment or remittance works.
                            example: "Repaid automatically as a share of your daily sales."
                          disclosure:
                            type: string
                            description: |
                              What the figure does not commit either party
                              to. The wording differs by `lexicon`.
                            example: "Not an offer of credit. Subject to review prior to approval."
                      theme:
                        type: object
                        description: |
                          Presentation tokens for the card. Further tokens
                          may be added over time, so pass this object
                          through rather than destructuring it.
                        additionalProperties: true
                        properties:
                          accent:
                            type: string
                            description: Accent colour, as a hex value.
                            example: "#1f6feb"
                  - title: No amount
                    type: object
                    description: |
                      The merchant cannot be served. Four keys, and
                      `applyUrl`, `copy` and `theme` are absent rather than
                      null — nothing is rendered, so no regulated wording is
                      owed. `mount()` returns `null` and yields the slot
                      back to your page.
                    required:
                      - correlationId
                      - amount
                      - currency
                      - lexicon
                    properties:
                      correlationId:
                        type: string
                        format: uuid
                        description: |
                          Stable identifier for this merchant's record,
                          returned here as it is for a qualifying merchant.
                          The render is still recorded.
                        example: "0f2c8b91-4d3a-4c15-8e77-2a9b6f1c4d0e"
                      amount:
                        type: "null"
                        description: |
                          Always `null` in this variant. This is a success,
                          not an error — see the endpoint description.
                      currency:
                        type: string
                        description: |
                          ISO 4217 currency code. Present even with no
                          amount to price.
                        example: "USD"
                      lexicon:
                        type: [string, "null"]
                        enum: ["loan", "mca", null]
                        description: |
                          `null` when the merchant's state is not one Onramp
                          operates in. **Populated** when the state is fine
                          and only the sales figure fell short, so this is
                          how the two no-amount causes are told apart.
                        example: "loan"
              examples:
                prequalified:
                  summary: A merchant who qualifies
                  description: |
                    $45,000 in 90-day sales: 50% is $22,500, rounded up to
                    the nearest $1,000.
                  value:
                    correlationId: "065a417b-ce17-4c64-b8dd-e35a3128a021"
                    amount: 23000.0
                    currency: "USD"
                    applyUrl: "https://app.onrampfunds.com/partners/prequalifications/3f2vKq8mDhRt6XyZbNwPcE4u"
                    lexicon: "loan"
                    copy:
                      qualifier: "Pre-qualified, not approved."
                      mechanism: "Repaid automatically as a share of your daily sales."
                      disclosure: "Not an offer of credit. Subject to review prior to approval."
                    theme:
                      accent: "#1f6feb"
                cashAdvanceState:
                  summary: A merchant in a cash advance state
                  description: |
                    The `mca` lexicon changes the wording: an advance is
                    remitted rather than repaid, and what it disclaims is a
                    commitment to purchase rather than an offer of credit.
                  value:
                    correlationId: "3f1d9c02-8a44-4f7e-9b1a-7c6f0d2e5b83"
                    amount: 23000.0
                    currency: "USD"
                    applyUrl: "https://app.onrampfunds.com/partners/prequalifications/9zYxWvUt7sRqPnMk5jHg3fDe"
                    lexicon: "mca"
                    copy:
                      qualifier: "Pre-qualified, not approved."
                      mechanism: "Remitted automatically as a share of your daily sales."
                      disclosure: "Not a commitment to purchase. Subject to review prior to approval."
                    theme:
                      accent: "#1f6feb"
                unsupportedState:
                  summary: No amount — a state Onramp does not operate in
                  description: |
                    A real merchant Onramp cannot serve. `lexicon` is `null`
                    because no agreement type applies in their state.
                  value:
                    correlationId: "0f2c8b91-4d3a-4c15-8e77-2a9b6f1c4d0e"
                    amount: null
                    currency: "USD"
                    lexicon: null
                belowThreshold:
                  summary: No amount — sales below the qualifying threshold
                  description: |
                    Sales were reported, so this is not an integration
                    error; they were simply under $22,500 across 90 days.
                    `lexicon` is populated because the state is supported.
                  value:
                    correlationId: "8b4e1f57-6c2d-4a90-b3e8-51d7c0a2f9b6"
                    amount: null
                    currency: "USD"
                    lexicon: "loan"
        "422":
          description: |
            The request could not be processed. This is an integration
            error rather than a decline — a merchant who does not qualify
            receives a `200` with a null amount, never a `422`.

            Note that the envelope and the `errors` keys are `snake_case`
            even though a successful response is `camelCase`.
          headers:
            Cache-Control:
              description: Always `no-store`. This response must not be cached.
              schema:
                type: string
                example: "no-store"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 422
                  error:
                    type: string
                    example: "validation_error"
                  message:
                    type: string
                    example: "Validation failed"
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
              examples:
                noSalesReported:
                  summary: No sales reported
                  description: |
                    Sales totalling zero, or platforms carrying no sales at
                    all. Returning a null amount here would let a broken
                    integration pass for a merchant who does not qualify.
                  value:
                    status: 422
                    error: "validation_error"
                    message: "Validation failed"
                    errors:
                      platforms:
                        - "must report sales greater than 0"
                missingSellerEmail:
                  summary: Missing seller email
                  value:
                    status: 422
                    error: "validation_error"
                    message: "Validation failed"
                    errors:
                      seller_email:
                        - "can't be blank"
                invalidOperatingState:
                  summary: Unrecognised state code
                  description: |
                    A code that is not a US state at all. A valid code for a
                    state Onramp does not operate in is a `200` with a null
                    amount instead.
                  value:
                    status: 422
                    error: "validation_error"
                    message: "Validation failed"
                    errors:
                      operating_state:
                        - "must be two character US state code"
        "401":
          description: |
            Unauthorized, invalid or missing JWT token. Caching is
            forbidden ahead of authentication, so a rejected request is no
            more cacheable than an accepted one.
          headers:
            Cache-Control:
              description: Always `no-store`. This response must not be cached.
              schema:
                type: string
                example: "no-store"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 401
                  error:
                    type: string
                    example: "unauthorized"
                  message:
                    type: string
                    example: "Invalid client"
        "500":
          description: Internal server error.
          headers:
            Cache-Control:
              description: Always `no-store`. This response must not be cached.
              schema:
                type: string
                example: "no-store"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 500
                  error:
                    type: string
                    example: "internal_server_error"
                  message:
                    type: string
                    example: "An internal server error occurred"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
